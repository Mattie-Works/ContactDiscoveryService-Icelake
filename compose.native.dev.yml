# Local development only. Never expose dev credentials to untrusted networks.
name: cdsi-native-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cdsi
      POSTGRES_USER: cdsi
      POSTGRES_PASSWORD: ${CDSI_POSTGRES_PASSWORD:?Configure a local PostgreSQL password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/main/resources/db/postgres-token-rate-limit.sql:/docker-entrypoint-initdb.d/001-cdsi.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
  cdsi:
    build:
      context: .
      dockerfile: Dockerfile.native
    image: cdsi-native:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MICRONAUT_ENVIRONMENTS: "dev,native"
      CDSI_ACCOUNT_POPULATOR: random
      CDSI_TOKEN_LIMITER_BACKEND: postgres
      RANDOM_ACCOUNT_POPULATOR_ACCOUNTS: "1000"
      POSTGRES_TOKEN_RATE_LIMIT_JDBC_URL: jdbc:postgresql://postgres:5432/cdsi
      POSTGRES_TOKEN_RATE_LIMIT_USERNAME: cdsi
      POSTGRES_TOKEN_RATE_LIMIT_PASSWORD: ${CDSI_POSTGRES_PASSWORD:?Configure a local PostgreSQL password}
      REDIS_LEAKY_BUCKET_MODE: standalone
      REDIS_LEAKY_BUCKET_HOST: redis
      REDIS_LEAKY_BUCKET_PASSWORD: ""
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    networks: [internal]
volumes:
  pgdata:
  redisdata:
networks:
  internal:
    driver: bridge
