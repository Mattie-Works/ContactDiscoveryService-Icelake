name: Native Linux CDSI (no SGX)

on:
  push:
    branches:
      - feature/native-linux-cdsi
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile.native'
      - 'compose.native.*.yml'
      - '.github/workflows/native-linux.yml'

permissions:
  contents: read

jobs:
  native-java-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and run native directory tests without Open Enclave
        run: ./mvnw -B -e -Pnative-linux -Dtest='Native*Test' -DtrimStackTrace=false -Dsurefire.printSummary=true test
      - name: Check Docker availability for PostgreSQL integration tests
        run: docker info >/dev/null
      - name: Run PostgreSQL and standalone Redis integration tests
        run: ./mvnw -B -e -Pnative-linux -Dtest='PostgresTokenRateLimiterIT,StandaloneRedisLeakyBucketRateLimiterIT' -DtrimStackTrace=false test
      - name: Show individual failing test names and errors
        if: failure()
        run: |
          echo '== Surefire report summaries =='
          find target/surefire-reports -name '*.txt' -maxdepth 1 -print -exec sh -c 'grep -E "Tests run:|<<< FAILURE!|<<< ERROR!" "$1" || true' _ {} \;
          echo '== Full test reports =='
          find target/surefire-reports -maxdepth 1 -name '*.txt' -exec cat {} \;
      - name: Save complete Maven Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  native-docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone image without Intel SGX runtime packages
        run: docker build -f Dockerfile.native -t cdsi-native:ci .

  native-compose-smoke:
    name: Self-hosted Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CDSI_POSTGRES_PASSWORD: ci-only-postgres-not-for-production
    steps:
      - uses: actions/checkout@v4
      - name: Build and start PostgreSQL, Redis and native CDSI
        run: docker compose -f compose.native.dev.yml up -d --build
      - name: Verify native application health and initial account load
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/health >/dev/null; then
              echo "CDSI health endpoint is responding"
              exit 0
            fi
            sleep 2
          done
          echo "CDSI did not become healthy"
          docker compose -f compose.native.dev.yml logs --tail=250
          exit 1
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose -f compose.native.dev.yml logs --tail=300
      - name: Remove test stack
        if: always()
        run: docker compose -f compose.native.dev.yml down -v
