name: Native Linux CDSI (no SGX)

on:
  push:
    branches:
      - feature/native-linux-cdsi
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile.native'
      - '.github/workflows/native-linux.yml'

permissions:
  contents: read

jobs:
  native-java-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and run native directory tests without Open Enclave
        run: ./mvnw -B -Pnative-linux -Dtest='Native*Test' test

  native-docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone image without Intel SGX runtime packages
        run: docker build -f Dockerfile.native -t cdsi-native:ci .
